{% extends "base.html" %}
{% block contenido %}
<h1>Reservar una mesa</h1>
{% if error %}<p class="error" id="error">{{ error }}</p>{% endif %}
<form method="post" action="/reservar">
  <label>Nombre <input id="nombre" name="nombre" required></label>
  <label>Correo <input id="correo" name="correo" type="email" required></label>
  <label>Fecha <input id="fecha" name="fecha" type="date" required></label>
  <label>Hora <input id="hora" name="hora" type="time" required></label>
  <label>Personas <input id="personas" name="personas" type="number" min="1" max="8" required></label>
  <button id="enviar" type="submit">Reservar</button>
</form>
{% endblock %}
